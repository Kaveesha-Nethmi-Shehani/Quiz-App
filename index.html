<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
</head>
<body>
    <div class="container">
        <h1 class="topic">🧠 Knowledge Hub Login</h1>

        <div class="options-container">
            <h2 class="category-title">Select Category</h2>
            <div class="category-option">
                <button class="category active">HTML</button>
                <button class="category">CSS</button>
                <button class="category">JavaScript</button>
            </div>
        </div>

          <div class="options-container">
            <h2 class="category-title">No Of Questions</h2>
            <div class="questions-option">
                <button class="questions active">10</button>
                <button class="questions">10</button>
                <button class="questions">10</button>
            </div>
        </div>

        <button class="quiz-btn">Get Start Quiz</button>
    </div>

    <div class="quiz-container">
        <header class="quiz-header">
            <h2 class="quiz-title">Quiz Application</h2>
            <div class="quiz-timer">
                <span class="material-symbols-rounded">
                    <span class="material-symbols-rounded">timer</span>
                    <p class="quiz-duration">15s</p>
            </div>
        </header>

        <div class="quiz-content">
            <h1 class="quiz-quoins"> <!--Which HTML attribute specifies the URL of a link? --></h1>
        <ul class="answer-options"></ul>
                <li class="answer-option">
                    <p>src</p>
                </li>
                <li class="answer-option">
                    <p>url</p>
            </li>
                <li class="answer-option correct">
                    <p>href</p>
                        <spn class="material-symbol-round">check_circle</spn>
                </li>
                <li class="answer-option incorrect">
                    <p>link</p>
                        <spn class="material-symbol-round">cancel</spn>
                </li>
        
                    
        </div>
        <div class="quiz-footer">
            <p class="question-status"> <!--<b>2</b> of <b>10</b> Questions --></p>
        <button class="next-quoins-btn">NEXT

                <spn class="material-symbol-round">➤</spn>
            </button>


        </div>

    </div>

    <div class="result-container">
        <h2 class="result-title">Quiz Completed!</h2>
            <p class="result-massages"> <!--You answered  <b>5</b> out of <b>10</b> questions correctly.Great effort!--> </p>
            
            <button class="try-again-button">Try Again</button>
        


        


</div>
    







    <script src="question.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.1.3/tsparticles.confetti.bundle.min.js"></script> 

</body>
</html>
